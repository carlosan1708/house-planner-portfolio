name: Full regression (on request)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOOGLE_CLOUD_PROJECT: demo-house-planner-qa
      HOUSE_PLANNER_ENVIRONMENT: qa
      HOUSE_PLANNER_BUCKET: demo-house-planner-qa.firebasestorage.app
      HOUSE_PLANNER_ADMIN_EMAIL: ""
      HOUSE_PLANNER_PUBLIC_URL: http://127.0.0.1:3000
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      STORAGE_EMULATOR_HOST: http://127.0.0.1:9199
      FIREBASE_STORAGE_EMULATOR_HOST: 127.0.0.1:9199
      NEXT_PUBLIC_HOUSE_PLANNER_ENVIRONMENT: qa
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-house-planner-qa
      NEXT_PUBLIC_FIREBASE_API_KEY: demo-key
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-house-planner-qa.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: demo-house-planner-qa.firebasestorage.app
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-app
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "000000000000"
      NEXT_PUBLIC_FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      HOUSE_PLANNER_AI_ENABLED: "0"
      QA_AI_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check
      - run: npm run lint
      - run: npm test
      - run: npm run build -- --webpack
      - run: npx playwright install --with-deps chromium
      - name: Local demo and mocked browser regression (no cloud credentials)
        run: npm run test:e2e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-15.13.0-java21
      - name: Install the pinned local Firebase emulator launcher
        run: |
          npm install --global firebase-tools@15.13.0
          echo "QA_FIREBASE_CLI_PATH=$(npm root --global)/firebase-tools/lib/bin/firebase.js" >> "$GITHUB_ENV"
      - name: Six-user permissions and data isolation against local emulators
        run: npm run qa:local -- --suite=permissions
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: requested-full-regression-failure-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            .qa-tools/logs
          if-no-files-found: ignore
          retention-days: 3
